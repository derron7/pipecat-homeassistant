name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall addons/pipecat_assist/app custom_components/pipecat_assist
      - name: Install lightweight test dependencies
        run: |
          python -m pip install "httpx>=0.28,<1" "loguru>=0.7,<1"
      - name: Test ESPHome integration
        run: |
          python -m unittest \
            tests.test_va_pipecat_protocol \
            tests.test_esphome_provisioner \
            -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build add-on image
        run: |
          docker build \
            --tag pipecat-assist-ci \
            --build-arg BUILD_VERSION=dev \
            --build-arg BUILD_ARCH=amd64 \
            addons/pipecat_assist
      - name: Test ESPHome satellite transport in the add-on image
        run: |
          docker run --rm \
            --entrypoint python3 \
            --volume "${{ github.workspace }}/tests:/tests:ro" \
            pipecat-assist-ci \
            -m unittest discover -s /tests -v

  ui-bundle:
    name: UI bundle in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: addons/pipecat_assist/ui-src/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: addons/pipecat_assist/ui-src
        run: pnpm install --frozen-lockfile
      - name: Build bundle
        working-directory: addons/pipecat_assist/ui-src
        run: pnpm build
      - name: Fail if committed bundle is stale
        run: |
          if ! git diff --quiet -- addons/pipecat_assist/app/ui/; then
            echo "::error::app/ui is out of date. Run the 'Build UI bundle' workflow."
            git diff --stat -- addons/pipecat_assist/app/ui/
            exit 1
          fi
          echo "Bundle is in sync."
           
