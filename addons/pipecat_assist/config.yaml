name: Pipecat Assist
version: "0.1.90"
slug: pipecat_assist
description: Realtime Pipecat assistant for Home Assistant with MCP device control and ESP32 satellite (Voice PE) support.
url: https://github.com/derron7/pipecat-homeassistant
image: ghcr.io/derron7/pipecat-homeassistant/pipecat-assist
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 7860
panel_icon: mdi:account-voice
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  runner_port: 7860
  log_level: "INFO"
  deepslate_vad_confidence: 0.4
  deepslate_vad_min_volume: 0.0
  deepslate_vad_start_ms: 150
  deepslate_vad_stop_ms: 390
schema:
  runner_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  deepslate_vad_confidence: float(0,1)
  deepslate_vad_min_volume: float(0,1)
  deepslate_vad_start_ms: int(50,2000)
  deepslate_vad_stop_ms: int(100,3000)
