name: Pipecat Assist
version: "0.1.83"
slug: pipecat_assist
description: Realtime Pipecat assistant for Home Assistant with MCP device control and ESP32 satellite (Voice PE) support.
url: https://github.com/derron7/pipecat-homeassistant
image: ghcr.io/derron7/pipecat-homeassistant/pipecat-assist
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 7860
panel_icon: mdi:account-voice
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  runner_port: 7860
  log_level: "INFO"
  elevenlabs_agent_api_key: ""
  elevenlabs_agent_id: ""
  elevenlabs_agent_base_url: "wss://api.elevenlabs.io"
  elevenlabs_agent_first_message: ""
  elevenlabs_agent_enable_client_tools: true  
schema:
  runner_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  elevenlabs_agent_api_key: password
  elevenlabs_agent_id: str?
  elevenlabs_agent_base_url: str
  elevenlabs_agent_first_message: str?
  elevenlabs_agent_enable_client_tools: bool
